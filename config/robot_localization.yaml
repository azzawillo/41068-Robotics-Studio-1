husky_ekf:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0          # was 20
    two_d_mode: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    publish_tf: true
    transform_time_offset: 0.0

    odom0: /odometry
    odom0_queue_size: 10
    odom0_config: [true, true, false,
                   false, false, false,
                   true, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    imu0: /imu
    imu0_queue_size: 50
    imu0_config: [false, false, false,
                  false, false, true,     # yaw
                  false, false, false,
                  false, false, true,     # yaw rate
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

ekf_parrot:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true

    map_frame: map
    odom_frame: parrot/odom
    base_link_frame: parrot/base_link
    world_frame: parrot/odom
    publish_tf: true
    transform_time_offset: 0.0

    odom0: /parrot/odometry
    odom0_queue_size: 10
    odom0_config: [true, true, false,
                   false, false, false,
                   true, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    imu0: /parrot/imu
    imu0_queue_size: 50
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
