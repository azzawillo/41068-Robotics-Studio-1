# config/robot_localization.yaml
husky_ekf:
  ros__parameters:
    use_sim_time: true
    frequency: 20.0
    two_d_mode: true

    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    publish_tf: true

    odom0: /odometry
    odom0_config: [true,  true,  false,   # x y z
                   false, false, false,   # roll pitch yaw  (disable yaw here)
                   true,  false, false,   # vx vy vz
                   false, false, false,   # vroll vpitch vyaw
                   false, false, false]   # ax ay az
    odom0_differential: false
    odom0_relative:     false

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,     # only yaw from orientation
                  false, false, false,
                  false, false, true,     # yaw rate
                  false, false, false]
    imu0_differential: false
    imu0_relative:     false
    imu0_remove_gravitational_acceleration: true


# Parrot EKF (2D) -> publishes parrot/odom -> parrot/base_link
ekf_parrot:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true

    map_frame: map
    odom_frame: parrot/odom
    base_link_frame: parrot/base_link
    world_frame: parrot/odom
    publish_tf: true

    odom0: /parrot/odometry
    odom0_config: [true,  true,  false,
                   false, false, false,   # disable yaw here too
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative:     false

    imu0: /parrot/imu
    imu0_config: [false, false, false,
                  false, false, true,     # yaw only
                  false, false, false,
                  false, false, true,     # yaw rate
                  false, false, false]
    imu0_differential: false
    imu0_relative:     false
    imu0_remove_gravitational_acceleration: true
